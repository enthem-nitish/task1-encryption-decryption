<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caesar Cipher — Encrypt & Decrypt</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #7c5cfc;
      --accent2: #fc5c7d;
      --gold: #f5c842;
      --text: #e8eaf0;
      --muted: #6b7280;
      --glow: rgba(124,92,252,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
    }

    /* ── 3D Canvas Background ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite;
    }
    .orb1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: -5s; }
    .orb3 { width: 300px; height: 300px; background: #5cc8fc; top: 40%; left: 50%; animation-delay: -9s; }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* ── Layout ── */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,92,252,0.12);
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .badge .dot {
      width: 6px; height: 6px;
      background: #a78bfa;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #a78bfa 70%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      width: 100%;
      max-width: 720px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 64px rgba(0,0,0,0.5);
      animation: fadeUp 0.8s ease both;
      transition: box-shadow 0.3s;
    }
    .card:hover {
      box-shadow: 0 0 0 1px rgba(124,92,252,0.2), 0 32px 80px rgba(0,0,0,0.6), 0 0 60px var(--glow);
    }

    /* ── Mode Toggle ── */
    .mode-toggle {
      display: flex;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
      position: relative;
    }
    .mode-toggle .slider {
      position: absolute;
      top: 4px; left: 4px;
      height: calc(100% - 8px);
      width: calc(50% - 4px);
      background: linear-gradient(135deg, var(--accent), #9d7cff);
      border-radius: 10px;
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 4px 20px rgba(124,92,252,0.4);
    }
    .mode-toggle.decrypt .slider { transform: translateX(100%); }
    .mode-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      position: relative;
      z-index: 1;
      transition: color 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .mode-btn.active { color: #fff; }

    /* ── Labels & Inputs ── */
    .field { margin-bottom: 22px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea, input[type="range"] {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
    }

    textarea {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 16px;
      resize: vertical;
      min-height: 120px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    textarea:focus {
      border-color: rgba(124,92,252,0.6);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }
    textarea::placeholder { color: rgba(255,255,255,0.2); }

    /* ── Shift Slider ── */
    .shift-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .shift-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 600;
      color: #a78bfa;
      min-width: 40px;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 100px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9d7cff);
      box-shadow: 0 0 0 4px rgba(124,92,252,0.25), 0 4px 12px rgba(124,92,252,0.5);
      cursor: pointer;
      transition: transform 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #9d7cff 50%, var(--accent2) 100%);
      background-size: 200% 200%;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s, background-position 0.5s;
      box-shadow: 0 8px 32px rgba(124,92,252,0.4);
      margin-top: 4px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124,92,252,0.6);
      background-position: right center;
    }
    .btn:active { transform: translateY(0); }
    .btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* ── Result ── */
    #result-section {
      width: 100%;
      max-width: 720px;
      margin-top: 28px;
      animation: fadeUp 0.5s ease both;
    }

    .result-card {
      background: rgba(124,92,252,0.06);
      border: 1px solid rgba(124,92,252,0.25);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 20px 20px 0 0;
    }

    .result-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 10px;
    }
    .result-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      color: #fff;
      word-break: break-all;
      line-height: 1.7;
    }

    .copy-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(124,92,252,0.15);
      border: 1px solid rgba(124,92,252,0.3);
      color: #a78bfa;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: rgba(124,92,252,0.3); }
    .copy-btn.copied { color: #4ade80; border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.1); }

    /* ── Shift Table ── */
    .table-wrap {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-title {
      padding: 14px 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .alphabet-grid {
      display: flex;
      overflow-x: auto;
      padding: 16px 14px 12px;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,92,252,0.3) transparent;
    }
    .alpha-pair {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 30px;
    }
    .alpha-orig, .alpha-shifted {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .alpha-orig {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }
    .alpha-shifted {
      background: rgba(124,92,252,0.15);
      color: #a78bfa;
    }
    .alpha-pair.highlight .alpha-orig { background: rgba(252,92,125,0.2); color: #fc5c7d; }
    .alpha-pair.highlight .alpha-shifted { background: rgba(245,200,66,0.2); color: var(--gold); transform: scale(1.15); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .stat-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
      display: block;
    }
    .stat-lbl { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .hidden { display: none !important; }

    /* ── Error ── */
    .error-msg {
      background: rgba(252,92,125,0.1);
      border: 1px solid rgba(252,92,125,0.3);
      border-radius: 10px;
      color: #fc5c7d;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .card { padding: 24px 18px; }
      .stats-row { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>

<!-- 3D animated background -->
<canvas id="bg-canvas"></canvas>

<!-- Ambient orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="app">
  <header>
    <div class="badge"><span class="dot"></span> Task-01 · Python Project</div>
    <h1>Caesar Cipher</h1>
    <p class="subtitle">Encrypt & decrypt messages using the classic shift cipher algorithm</p>
  </header>

  <!-- Main Card -->
  <div class="card">
    <!-- Mode Toggle -->
    <div class="mode-toggle" id="modeToggle">
      <div class="slider"></div>
      <button class="mode-btn active" id="encBtn" onclick="setMode('encrypt')">
        🔒 Encrypt
      </button>
      <button class="mode-btn" id="decBtn" onclick="setMode('decrypt')">
        🔓 Decrypt
      </button>
    </div>

    <!-- Input -->
    <div class="field">
      <label>Your Message</label>
      <textarea id="inputText" placeholder="Enter your message here…" rows="4"></textarea>
    </div>

    <!-- Shift -->
    <div class="field">
      <label>Shift Value</label>
      <div class="shift-row">
        <input type="range" id="shiftRange" min="1" max="25" value="3" oninput="updateShift(this.value)"/>
        <div class="shift-val" id="shiftDisplay">3</div>
      </div>
    </div>

    <!-- Submit -->
    <button class="btn" id="processBtn" onclick="processText()">
      🔐 Process Message
    </button>

    <div class="error-msg hidden" id="errorMsg"></div>
  </div>

  <!-- Result Section -->
  <div id="result-section" class="hidden">

    <div class="result-card">
      <div class="result-label" id="resultLabel">Encrypted Output</div>
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy</button>
      <div class="result-text" id="resultText"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-val" id="statChars">0</span>
        <span class="stat-lbl">Characters</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="statLetters">0</span>
        <span class="stat-lbl">Letters Shifted</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="statShift">3</span>
        <span class="stat-lbl">Shift Used</span>
      </div>
    </div>

    <div class="table-wrap" style="margin-top:20px;">
      <div class="table-title">🔤 Alphabet Mapping (Original → Shifted)</div>
      <div class="alphabet-grid" id="alphaGrid"></div>
    </div>

  </div>
</div>

<!-- 3D Background Script -->
<script>
// ── 3D Particle Field ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], lines = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

function initParticles() {
  particles = [];
  const count = Math.floor((W * H) / 12000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.8 + 0.4,
      alpha: Math.random() * 0.5 + 0.1,
      color: Math.random() > 0.5 ? '124,92,252' : (Math.random() > 0.5 ? '252,92,125' : '92,200,252'),
    });
  }
}
initParticles();

let mouseX = W/2, mouseY = H/2;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (let p of particles) {
    p.x += p.vx + (mouseX - W/2) * 0.00005;
    p.y += p.vy + (mouseY - H/2) * 0.00005;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
    ctx.fill();
  }

  // Draw connecting lines
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(124,92,252,${0.06 * (1 - dist/120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}
draw();

// ── App Logic ──
let currentMode = 'encrypt';
let lastResult = '';

function setMode(mode) {
  currentMode = mode;
  const toggle = document.getElementById('modeToggle');
  const encBtn = document.getElementById('encBtn');
  const decBtn = document.getElementById('decBtn');

  if (mode === 'encrypt') {
    toggle.classList.remove('decrypt');
    encBtn.classList.add('active');
    decBtn.classList.remove('active');
  } else {
    toggle.classList.add('decrypt');
    decBtn.classList.add('active');
    encBtn.classList.remove('active');
  }
}

function updateShift(val) {
  document.getElementById('shiftDisplay').textContent = val;
}

async function processText() {
  const text = document.getElementById('inputText').value.trim();
  const shift = parseInt(document.getElementById('shiftRange').value);
  const errorDiv = document.getElementById('errorMsg');
  const btn = document.getElementById('processBtn');

  errorDiv.classList.add('hidden');

  if (!text) {
    errorDiv.textContent = '⚠️ Please enter a message to process.';
    errorDiv.classList.remove('hidden');
    return;
  }

  btn.textContent = '⏳ Processing…';
  btn.classList.add('loading');

  try {
    const res = await fetch('/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, shift, mode: currentMode })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    lastResult = data.output;
    showResult(data);
  } catch(err) {
    errorDiv.textContent = '❌ Error: ' + err.message;
    errorDiv.classList.remove('hidden');
  } finally {
    btn.textContent = '🔐 Process Message';
    btn.classList.remove('loading');
  }
}

function showResult(data) {
  const section = document.getElementById('result-section');
  section.classList.remove('hidden');

  // Animate text reveal
  const resultEl = document.getElementById('resultText');
  document.getElementById('resultLabel').textContent =
    data.mode === 'encrypt' ? '🔒 Encrypted Output' : '🔓 Decrypted Output';
  resultEl.textContent = '';

  let i = 0;
  const interval = setInterval(() => {
    resultEl.textContent += data.output[i];
    i++;
    if (i >= data.output.length) clearInterval(interval);
  }, 18);

  // Stats
  const letters = data.output.replace(/[^a-zA-Z]/g,'').length;
  document.getElementById('statChars').textContent = data.output.length;
  document.getElementById('statLetters').textContent = letters;
  document.getElementById('statShift').textContent = data.shift;

  // Alphabet grid
  buildAlphaGrid(data.alphabet, data.shifted, data.original, data.output);

  // Reset copy btn
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.textContent = 'Copy';
  copyBtn.classList.remove('copied');

  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildAlphaGrid(orig, shifted, inputText, outputText) {
  const grid = document.getElementById('alphaGrid');
  grid.innerHTML = '';

  // Find which letters are actually used
  const usedOrig = new Set(inputText.toUpperCase().split('').filter(c => /[A-Z]/.test(c)));
  const usedShifted = new Set(outputText.toUpperCase().split('').filter(c => /[A-Z]/.test(c)));

  orig.forEach((o, i) => {
    const pair = document.createElement('div');
    pair.className = 'alpha-pair';
    if (usedOrig.has(o) || usedShifted.has(shifted[i])) {
      pair.classList.add('highlight');
    }
    pair.innerHTML = `
      <div class="alpha-orig">${o}</div>
      <div class="alpha-shifted">${shifted[i]}</div>
    `;
    grid.appendChild(pair);
  });
}

function copyResult() {
  if (!lastResult) return;
  navigator.clipboard.writeText(lastResult).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// Enter key support
document.getElementById('inputText').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') processText();
});
</script>
</body>
</html>
